{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <div class="form-card form-card--edit">

        <!-- ── Header ─────────────────────────────────── -->
        <header class="form-header">

            <a href="{{ url_for('dashboard') }}" class="back-link" aria-label="Back to dashboard">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                     stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5"/>
                    <path d="m12 19-7-7 7-7"/>
                </svg>
                <span>Dashboard</span>
            </a>

            <div class="form-title">

                <span class="form-title__icon form-title__icon--edit" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                    </svg>
                </span>

                <div>
                    <h1>Edit Password</h1>
                    <p class="form-subtitle">
                        Update the details for
                        <strong>{{ password['website'] }}</strong>.
                    </p>
                </div>

            </div>

        </header>


        <!-- ── Form ───────────────────────────────────── -->
        <form method="POST" class="password-form" novalidate>

            <!-- Website -->
            <div class="field">

                <label for="website">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M2 12h20"/>
                        <path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/>
                    </svg>
                    Website / Application
                </label>

                <input
                    type="text"
                    id="website"
                    name="website"
                    value="{{ password['website'] }}"
                    autocomplete="off"
                    spellcheck="false"
                    required
                >

            </div>


            <!-- Username -->
            <div class="field">

                <label for="username">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Username / Email
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ password['username'] }}"
                    autocomplete="off"
                    spellcheck="false"
                    required
                >

            </div>


            <!-- Password -->
            <div class="field">

                <label for="password">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    Password
                </label>

                <div class="password-input">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        value="{{ password['password'] }}"
                        autocomplete="new-password"
                        oninput="updateStrength(this.value)"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-btn"
                        onclick="toggleInputPassword()"
                        aria-label="Show or hide password"
                    >
                        <svg class="icon-eye" viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a17.9 17.9 0 0 1-2.16 3.19"/>
                            <path d="M6.61 6.61A17.9 17.9 0 0 0 2 12s3.5 7 10 7a9.1 9.1 0 0 0 5.39-1.61"/>
                            <path d="m2 2 20 20"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        </svg>
                        <span class="toggle-text">Show</span>
                    </button>

                </div>

                <!-- Strength meter -->
                <div class="strength" aria-hidden="true">
                    <div class="strength__bar">
                        <span class="strength__seg" data-seg="1"></span>
                        <span class="strength__seg" data-seg="2"></span>
                        <span class="strength__seg" data-seg="3"></span>
                        <span class="strength__seg" data-seg="4"></span>
                    </div>
                    <div class="strength__meta">
                        <span class="strength__label" id="strengthLabel">Strength</span>
                        <span class="strength__hint" id="strengthHint">
                            Use 12+ characters with mixed case, numbers &amp; symbols.
                        </span>
                    </div>
                </div>

            </div>


            <!-- Generate -->
            <button
                type="button"
                class="generate-btn"
                onclick="generatePassword()"
            >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                     stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 3v4"/>
                    <path d="M3 5h4"/>
                    <path d="M19 17v4"/>
                    <path d="M17 19h4"/>
                    <path d="m9 15 6-6"/>
                    <path d="M9 9h.01"/>
                    <path d="M15 15h.01"/>
                </svg>
                Generate New Password
            </button>


            <!-- Notes -->
            <div class="field">

                <label for="notes">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
                        <path d="M14 2v6h6"/>
                        <path d="M8 13h8"/>
                        <path d="M8 17h5"/>
                    </svg>
                    Notes
                    <span class="label-optional">Optional</span>
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    placeholder="Add any extra information (recovery codes, security questions, etc.)"
                >{{ password['notes'] or '' }}</textarea>

            </div>


            <!-- Actions -->
            <div class="form-actions">

                <button type="submit" class="save-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                         stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 6 9 17l-5-5"/>
                    </svg>
                    Update Password
                </button>

                <a href="{{ url_for('dashboard') }}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>


        <!-- ── Danger zone ────────────────────────────── -->
        <div class="danger-zone">

            <div class="danger-zone__text">
                <h3>Danger Zone</h3>
                <p>Permanently delete this saved password. This action cannot be undone.</p>
            </div>

            <form method="POST"
                  action="{{ url_for('delete_password', id=password['id']) }}"
                  onsubmit="return confirm('Delete this password permanently? This cannot be undone.');">

                <button type="submit" class="danger-btn">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                         stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 6h18"/>
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                        <path d="M10 11v6"/>
                        <path d="M14 11v6"/>
                    </svg>
                    Delete Password
                </button>

            </form>

        </div>

    </div>

</div>


<!-- ═══════════════════════════════════════════════════════
     SCRIPT
     ═══════════════════════════════════════════════════════ -->
<script>
(function () {
    "use strict";

    const pwdInput     = document.getElementById("password");
    const toggleBtn    = document.querySelector(".toggle-btn");
    const toggleText   = document.querySelector(".toggle-text");
    const strengthSegs = document.querySelectorAll(".strength__seg");
    const strengthLbl  = document.getElementById("strengthLabel");
    const strengthHint = document.getElementById("strengthHint");

    /* ---------- Show / Hide ---------- */
    window.toggleInputPassword = function () {
        const isPwd = pwdInput.type === "password";
        pwdInput.type = isPwd ? "text" : "password";
        toggleBtn.classList.toggle("is-visible", isPwd);
        toggleText.textContent = isPwd ? "Hide" : "Show";
        pwdInput.focus({ preventScroll: true });
    };

    /* ---------- Strength scoring ---------- */
    function scorePassword(value) {
        let score = 0;
        if (!value) return 0;

        if (value.length >= 8)  score++;
        if (value.length >= 12) score++;
        if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
        if (/\d/.test(value)) score++;
        if (/[^A-Za-z0-9]/.test(value)) score++;

        if (/^(.)\1+$/.test(value)) score = 1;
        if (/^[a-z]+$/i.test(value) && value.length < 10) score = Math.min(score, 1);

        return Math.min(4, Math.max(0, Math.round((score / 5) * 4)));
    }

    const LABELS = {
        0: { text: "Strength",  cls: "" },
        1: { text: "Weak",      cls: "is-weak" },
        2: { text: "Fair",      cls: "is-fair" },
        3: { text: "Good",      cls: "is-good" },
        4: { text: "Excellent", cls: "is-strong" }
    };

    const HINTS = {
        0: "Use 12+ characters with mixed case, numbers & symbols.",
        1: "Too weak — add length, numbers and symbols.",
        2: "Fair — add uppercase letters and symbols.",
        3: "Good — a few more characters makes it excellent.",
        4: "Excellent — this password is very strong."
    };

    window.updateStrength = function (value) {
        const score = scorePassword(value);
        const meta  = LABELS[score];

        strengthSegs.forEach((seg, i) => {
            seg.classList.toggle("is-active", i < score);
        });

        document.querySelector(".strength").dataset.level = score;
        strengthLbl.textContent = meta.text;
        strengthLbl.className = "strength__label " + meta.cls;
        strengthHint.textContent = HINTS[score];
    };

    /* ---------- Password generator ---------- */
    window.generatePassword = function () {
        const LOWER  = "abcdefghijkmnopqrstuvwxyz";
        const UPPER  = "ABCDEFGHJKLMNPQRSTUVWXYZ";
        const DIGITS = "23456789";
        const SYMB   = "!@#$%^&*()-_=+[]{};:,.?/";
        const ALL    = LOWER + UPPER + DIGITS + SYMB;
        const LEN    = 20;

        const pick = (set) => set[Math.floor(Math.random() * set.length)];
        const bytes = new Uint32Array(LEN);
        (window.crypto || window.msCrypto).getRandomValues(bytes);

        let pwd = [ pick(LOWER), pick(UPPER), pick(DIGITS), pick(SYMB) ];

        for (let i = pwd.length; i < LEN; i++) {
            pwd.push(ALL[bytes[i] % ALL.length]);
        }

        for (let i = pwd.length - 1; i > 0; i--) {
            const j = bytes[i] % (i + 1);
            [pwd[i], pwd[j]] = [pwd[j], pwd[i]];
        }

        pwdInput.value = pwd.join("");
        pwdInput.type  = "text";
        toggleBtn.classList.add("is-visible");
        toggleText.textContent = "Hide";

        updateStrength(pwdInput.value);
        pwdInput.focus({ preventScroll: true });

        pwdInput.classList.add("pulse");
        setTimeout(() => pwdInput.classList.remove("pulse"), 550);
    };

    /* ---------- Initialise strength meter with existing value ---------- */
    if (pwdInput.value) {
        updateStrength(pwdInput.value);
    }

})();
</script>

{% endblock %}
