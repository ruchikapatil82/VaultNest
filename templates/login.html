{% extends "base.html" %}

{% block title %}Login · VaultNest{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card auth-card--login">

        <!-- ── Brand mark ─────────────────────────────── -->
        <div class="auth-brand">

            <span class="auth-brand__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2.5"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    <circle cx="12" cy="16.5" r="1.4"/>
                </svg>
            </span>

            <h1>Welcome back</h1>

            <p class="subtitle">
                Sign in to your secure vault.
            </p>

        </div>


        <!-- ── Form ───────────────────────────────────── -->
        <form method="POST" class="auth-form" novalidate>

            <!-- Username -->
            <div class="field">

                <label for="username">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    autofocus
                    spellcheck="false"
                    required
                >

            </div>


            <!-- Password -->
            <div class="field">

                <label for="password">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    Password
                </label>

                <div class="password-input">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-btn"
                        onclick="toggleInputPassword()"
                        aria-label="Show or hide password"
                    >
                        <svg class="icon-eye" viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a17.9 17.9 0 0 1-2.16 3.19"/>
                            <path d="M6.61 6.61A17.9 17.9 0 0 0 2 12s3.5 7 10 7a9.1 9.1 0 0 0 5.39-1.61"/>
                            <path d="m2 2 20 20"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        </svg>
                        <span class="toggle-text">Show</span>
                    </button>

                </div>

            </div>


            <!-- Remember + (optional) forgot link -->
            <div class="auth-options">

                <label class="checkbox">
                    <input type="checkbox" name="remember" value="1">
                    <span class="checkbox__box" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none"
                             stroke="currentColor" stroke-width="3"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 6 9 17l-5-5"/>
                        </svg>
                    </span>
                    <span class="checkbox__label">Remember me</span>
                </label>

                <a href="#" class="auth-options__link">
                    Forgot password?
                </a>

            </div>


            <!-- Submit -->
            <button type="submit" class="auth-submit">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                     stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <path d="m10 17 5-5-5-5"/>
                    <path d="M15 12H3"/>
                </svg>
                Sign In
            </button>

        </form>


        <!-- ── Divider ────────────────────────────────── -->
        <div class="auth-divider" aria-hidden="true">
            <span>New to VaultNest?</span>
        </div>


        <!-- ── Register CTA ───────────────────────────── -->
        <a href="{{ url_for('register') }}" class="auth-secondary">

            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                 stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Create a new account

        </a>

    </div>

</div>


<!-- ═══════════════════════════════════════════════════════
     SCRIPT
     ═══════════════════════════════════════════════════════ -->
<script>
(function () {
    "use strict";

    const pwdInput   = document.getElementById("password");
    const toggleBtn  = document.querySelector(".toggle-btn");
    const toggleText = document.querySelector(".toggle-text");

    window.toggleInputPassword = function () {
        const isPwd = pwdInput.type === "password";
        pwdInput.type = isPwd ? "text" : "password";
        toggleBtn.classList.toggle("is-visible", isPwd);
        toggleText.textContent = isPwd ? "Hide" : "Show";
        pwdInput.focus({ preventScroll: true });
    };

})();
</script>

{% endblock %}
